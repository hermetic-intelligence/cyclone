<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Allow Cyclone microphone access</title>
    <style>
      body { max-width: 34rem; margin: 3rem auto; padding: 0 1.5rem; font: 16px/1.5 system-ui, sans-serif; color: #18202a; }
      h1 { font-size: 1.5rem; }
      button { border: 0; border-radius: 7px; padding: .7rem 1rem; background: #275dad; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 3rem; }
    </style>
  </head>
  <body>
    <h1>Allow Cyclone to record your reasoning</h1>
    <p>Chrome needs to ask for microphone access in a full tab. Click below, then choose <strong>Allow while visiting the site</strong> in Chrome’s prompt. Cyclone will close this tab before recording starts. You can change this permission later in Chrome’s site settings.</p>
    <button id="allow" type="button">Request microphone access</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="permission.js"></script>
  </body>
</html>
