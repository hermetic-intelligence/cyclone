<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cyclone settings</title>
<style>
body{margin:0;background:#f6f8fa;color:#18202a;font:15px/1.55 system-ui,sans-serif}main{max-width:760px;margin:40px auto;padding:0 24px}header{margin-bottom:24px}.brand{font-weight:700;color:#275dad;margin:0}h1{font-size:30px;margin:4px 0}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px;margin:0}section{background:white;border:1px solid #dce1e7;border-radius:12px;padding:24px;margin:20px 0}label{display:block;font-weight:600}select,button{font:inherit;border:1px solid #98a4b3;border-radius:6px;background:white;color:#18202a;padding:8px 12px}select{width:100%;margin-top:8px}button{cursor:pointer;white-space:nowrap}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible{outline:3px solid #275dad;outline-offset:2px}article{display:flex;gap:16px;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid #dce1e7}article p{margin:6px 0}code{font-size:12px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}.muted,footer{color:#596575;font-size:13px}.error{color:#9c211b}.notice{color:#145a35}@media(max-width:600px){main{margin:24px auto;padding:0 16px}section{padding:16px}article{align-items:start;flex-direction:column}}
</style></head>
<body><div id="root"></div><script type="module" src="settings.js"></script></body>
</html>
