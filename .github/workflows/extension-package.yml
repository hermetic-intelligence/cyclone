name: Cyclone developer release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:reports
      - run: bun run package:friends
        env:
          CYCLONE_BUILD_SHA: ${{ github.sha }}
          CYCLONE_BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: cyclone-friends-${{ github.sha }}
          path: extension/.outputs/Cyclone-*-friends.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable developer release
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLONE_BUILD_SHA: ${{ github.sha }}
        run: |
          tag="dev-${CYCLONE_BUILD_SHA}"
          package=$(find extension/.outputs -maxdepth 1 -name 'Cyclone-*-friends.zip' -type f -print -quit)
          test -n "$package"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$CYCLONE_BUILD_SHA" --title "Cyclone developer build ${CYCLONE_BUILD_SHA:0:12}" --notes "Unzip the asset and load the extension directory. This build is identified by commit ${CYCLONE_BUILD_SHA}." --prerelease
          fi
          gh release upload "$tag" "$package" --clobber
